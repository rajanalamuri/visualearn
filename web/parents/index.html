<body class="home">
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="/" aria-label="VisuaLearn home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" class="b-bg"/><rect x="7" y="18" width="4" height="7" rx="1" class="b-1"/><rect x="14" y="12" width="4" height="13" rx="1" class="b-2"/><rect x="21" y="7" width="4" height="18" rx="1" class="b-3"/></svg>

    <nav class="nav" aria-label="Sections">
      <a href="/play/">Play</a>
      <a href="/math/grades/">Grades</a>
      <a href="/progress/">Diary</a>
    </nav>
    <span class="timer" id="timer" hidden></span>
  </div>
</header>

<main class="wrap ar pg">
  <h1>Parents</h1>
  <form class="p-card" id="p-gate">
    <label for="p-a" id="p-q"></label>
    <div class="p-row"><input id="p-a" type="text" inputmode="numeric" autocomplete="off" required><button class="btn primary" type="submit">Continue</button></div>
  </form>
  <div class="p-card" id="p-out" hidden>
    <button class="btn primary" id="p-google" type="button">Sign in with Google</button>
  </div>
  <div class="p-card" id="p-in" hidden>
    <p class="p-who" id="p-who"></p>
    <div class="p-row">
      <button class="btn primary" id="p-sync" type="button">Sync now</button>
      <button class="btn" id="p-signout" type="button">Sign out</button>
      <button class="link" id="p-delete" type="button">Delete cloud copy</button>
    </div>
  </div>
  <p class="p-card" id="p-off" hidden>Sign-in is not switched on yet.</p>
  <p class="fine" id="p-status" role="status" aria-live="polite"></p>
  <p class="fine">Only the diary is synced. Children never sign in. <a href="/privacy/">Privacy</a></p>
</main>

<div class="rest" id="rest" role="dialog" aria-modal="true" aria-labelledby="rest-h" hidden>
  <div class="rest-card">
    <div id="rest-body">
      <p class="eyebrow">Screen time is up for today</p>
      <h2 id="rest-h">Your turn.</h2>
      <p>Put the screen down and try one for real.</p>
      <div class="rest-actions">
        <button class="btn" id="rest-bye" type="button">See you tomorrow</button>
        <button class="link" id="rest-more" type="button">A grown-up says 5 more minutes</button>
      </div>
    </div>
    <div id="rest-done" hidden>
      <h2>Great choice.</h2>
      <p>You can close this tab now.</p>
    </div>
  </div>
</div>

<footer class="foot">

  </div>
