server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;            # /play -> /play/ keeps whatever host the visitor used
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        include /etc/nginx/snippets/security.conf;
        try_files $uri $uri/ =404;    # folders serve their index.html, like the Worker
    }

    location = /404.html {
        internal;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security.conf;
        types { }
        default_type application/manifest+json;
    }

    # The service worker must always be re-checked and may control the whole site.
    location = /sw.js {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Fonts never change under the same name.
    location /assets/fonts/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/\.well-known/ {
        include /etc/nginx/snippets/security.conf;
        default_type application/json;
    }
}
